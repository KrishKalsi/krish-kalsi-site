<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: #0A0A0A; clip-path: {{clip}}">
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 44px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #383836; font-size: 13px">

</div>
<div style="position: absolute; left: 64px; top: 92px; width: 1312px; height: 760px; box-sizing: border-box; border: 1px solid #383836; background: #111111"></div>
<div style="position: absolute; left: 101px; top: 165px; font-size: 212px; line-height: 0.84; font-weight: 300; letter-spacing: -0.055em; color: #E9E9E5; white-space: nowrap">Krish Kalsi</div>
<div style="position: absolute; left: 109px; top: 383px; font-size: 22px; color: #B9B9B5">Data science student</div>

<sc-if value="{{showPlay}}" hint-placeholder-val="{{true}}">
<button onClick="{{play}}" style="position: absolute; left: 620px; top: 28px; width: 200px; min-height: 44px; border: 1px solid #E9E9E5; background: #0A0A0A; color: #E9E9E5; font: inherit; font-size: 12px; text-transform: uppercase; cursor: pointer">▶ Play loader</button>
</sc-if>
<sc-if value="{{showReplay}}" hint-placeholder-val="{{false}}">
<button onClick="{{play}}" style="position: absolute; left: 620px; top: 108px; width: 200px; min-height: 44px; border: 1px solid #E9E9E5; background: #111111; color: #E9E9E5; font: inherit; font-size: 12px; text-transform: uppercase; cursor: pointer">Replay ↻</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  pts(seed) {
    if (this._ps === seed) return this._p;
    const r = this.rng(seed), n = 140, out = [{ x: 64, y: 430 }];
    let ls = 0;
    for (let i = 1; i <= n; i++) {
      let u = 0; while (u === 0) u = r(); const v = r();
      ls += 0.25 * Math.sqrt(1 / n) * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      out.push({ x: 64 + i / n * 1312, y: Math.min(Math.max(430 - ls * 560, 150), 640) });
    }
    this._ps = seed; this._p = out;
    return out;
  }
  play() {
    cancelAnimationFrame(this._raf);
    const seed = Math.floor(Math.random() * 1e9), t0 = performance.now();
    const loop = () => {
      const t = performance.now() - t0;
      if (t >= 3200) { this.setState({ phase: 'done', t: 3200, seed: seed }); return; }
      this.setState({ phase: 'run', t: t, seed: seed });
      this._raf = requestAnimationFrame(loop);
    };
    loop();
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }
  renderVals() {
    const st = this.state || {};
    const phase = st.phase || 'idle';
    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const pts = this.pts(st.seed || 20261002);
    let p = 0.62, rv = 0;
    if (phase !== 'idle') {
      p = ease(Math.min(st.t / 1900, 1));
      rv = st.t < 2150 ? 0 : ease(Math.min((st.t - 2150) / 950, 1));
    }
    if (phase === 'done') rv = 1;
    const n = pts.length - 1, fp = p * n, k = Math.min(Math.floor(fp), n - 1), fr = fp - k;
    const f = v => v.toFixed(1);
    let d = '';
    for (let i = 0; i <= k; i++) d += (i ? 'L' : 'M') + f(pts[i].x) + ' ' + f(pts[i].y);
    const tx = pts[k].x + (pts[k + 1].x - pts[k].x) * fr, ty = pts[k].y + (pts[k + 1].y - pts[k].y) * fr;
    d += 'L' + f(tx) + ' ' + f(ty);
    const R = Math.hypot(Math.max(tx, 1440 - tx), Math.max(ty, 900 - ty)) + 4;
    return {
      d: d, tx: f(tx), ty: f(ty),
      clip: 'circle(' + f(rv * R) + 'px at ' + f(tx) + 'px ' + f(ty) + 'px)',
      count: String(Math.round(p * 100)).padStart(3, '0'),
      step: Math.round(p * 140),
      showPlay: phase === 'idle', showReplay: phase === 'done',
      play: () => this.play()
    };
  }
}
</script>
</body>
</html>
