<sc-if value="{{showPlay}}" hint-placeholder-val="{{true}}">
<button onClick="{{play}}" style="position: absolute; left: 620px; top: 28px; width: 200px; min-height: 44px; border: 1px solid #E9E9E5; background: #0A0A0A; color: #E9E9E5; font: inherit; font-size: 12px; text-transform: uppercase; cursor: pointer">▶ Play loader</button>
</sc-if>
<sc-if value="{{showReplay}}" hint-placeholder-val="{{false}}">
<button onClick="{{play}}" style="position: absolute; left: 620px; top: 108px; width: 200px; min-height: 44px; border: 1px solid #E9E9E5; background: #111111; color: #E9E9E5; font: inherit; font-size: 12px; text-transform: uppercase; cursor: pointer">Replay ↻</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  play() {
    cancelAnimationFrame(this._raf);
    const t0 = performance.now();
    const loop = () => {
      const t = performance.now() - t0;
      if (t >= 2800) { this.setState({ phase: 'done', t: 2800 }); return; }
      this.setState({ phase: 'run', t: t });
      this._raf = requestAnimationFrame(loop);
    };
    loop();
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }
  renderVals() {
    const st = this.state || {};
    const phase = st.phase || 'idle';
    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    let p = 0.62, fill = 0, rv = 0;
    if (phase !== 'idle') {
      p = ease(Math.min(st.t / 1500, 1));
      fill = st.t < 1500 ? 0 : Math.min((st.t - 1500) / 250, 1);
      rv = st.t < 1850 ? 0 : ease(Math.min((st.t - 1850) / 950, 1));
    }
    if (phase === 'done') rv = 1;
    const f = v => v.toFixed(2);
    const cx = 720, cy = 450, r = 22, a = Math.min(p, 0.9999) * 2 * Math.PI;
    const ex = cx + r * Math.sin(a), ey = cy - r * Math.cos(a);
    const arc = 'M' + cx + ' ' + (cy - r) + 'A' + r + ' ' + r + ' 0 ' + (p > 0.5 ? 1 : 0) + ' 1 ' + f(ex) + ' ' + f(ey);
    const R = Math.hypot(720, 450) + 4;
    return {
      arc: arc, dot: f(3 + fill * 19),
      clip: 'circle(' + f(rv * R) + 'px at 720px 450px)',
      count: String(Math.round(p * 100)).padStart(3, '0'),
      showPlay: phase === 'idle', showReplay: phase === 'done',
      play: () => this.play()
    };
  }
}
</script>
</body>
</html>
